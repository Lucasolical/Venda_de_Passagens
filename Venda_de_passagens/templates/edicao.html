<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Voo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body style="background-color: #f8f9fa;">

    <div class="container mt-5">

        <a href="{{ url_for('listar_voos_para_admin', nome_usuario='admin') }}" class="btn btn-primary mb-4">
            Voltar
        </a>

        <h1 class="mb-4">Editar Voo {{ codigo }}</h1>

        <form action="{{ url_for('editar_voo', codigo=codigo) }}" method="POST" class="bg-white p-4 rounded shadow-sm">

            <div class="mb-3">
                <label for="origem" class="form-label">Origem</label>
                <input type="text" class="form-control" id="origem" name="origem" value="{{ voo.origem }}" required>
            </div>
            <div class="mb-3">
                <label for="destino" class="form-label">Destino</label>
                <input type="text" class="form-control" id="destino" name="destino" value="{{ voo.destino }}" required>
            </div>
            <div class="mb-3">
                <label for="milhas" class="form-label">Milhas</label>
                <input type="number" class="form-control" id="milhas" name="milhas" value="{{ voo.milhas }}" required>
            </div>
            <div class="mb-3">
                <label for="preco" class="form-label">Preço (R$)</label>
                <input type="number" step="0.01" class="form-control" id="preco" name="preco" value="{{ voo.preco }}" required>
            </div>
            <div class="mb-3">
                <label for="aeronave" class="form-label">Aeronave</label>
                <input type="text" class="form-control" id="aeronave" name="aeronave" value="{{ voo.aeronave }}" required>
            </div>
            <div class="mb-3">
                <label for="assentos" class="form-label">Assentos</label>
                <input type="number" class="form-control" id="assentos" name="assentos" value="{{ voo.assentos }}" required>
            </div>

            <button type="submit" class="btn btn-success mt-3">Salvar Alterações</button>
            
            <a href="{{ url_for('listar_voos_para_admin', nome_usuario='admin') }}" class="btn btn-outline-secondary mt-3 ms-2">Cancelar</a>
        </form>
    </div>

</body>
</html>
